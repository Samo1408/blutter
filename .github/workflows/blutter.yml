name: Blutter Analyze

on:
  workflow_dispatch:
  push:
    paths:
      - "input/**"
      - ".github/workflows/blutter.yml"

permissions:
  contents: read

concurrency:
  group: blutter-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate input libraries
        shell: bash
        run: |
          set -euo pipefail
          test -s input/libapp.so || {
            echo "::error::Missing input/libapp.so"
            exit 1
          }
          test -s input/libflutter.so || {
            echo "::error::Missing input/libflutter.so"
            exit 1
          }

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gcc-13 g++-13 \
            cmake ninja-build pkg-config \
            libicu-dev libcapstone-dev \
            python3 python3-pip python3-venv \
            git zip unzip

      - name: Configure Python environment
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install pyelftools requests

      - name: Check compiler
        run: |
          gcc-13 --version
          g++-13 --version
          cmake --version
          ninja --version

      - name: Patch Dart snapshot symbol compatibility
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python - <<'PY'
          from pathlib import Path

          path = Path("extract_dart_info.py")
          source = path.read_text()
          lines = source.splitlines()
          target = "sym = dynsym.get_symbol_by_name('_kDartVmSnapshotData')[0]"

          for index, line in enumerate(lines):
              if line.strip() == target:
                  indent = line[:len(line) - len(line.lstrip())]
                  replacement = [
                      indent + "syms = dynsym.get_symbol_by_name('_kDartVmSnapshotData')",
                      indent + "if not syms:",
                      indent + "    syms = dynsym.get_symbol_by_name('_kDartSnapshotData')",
                      indent + "assert syms, 'Cannot find Dart snapshot data symbol (_kDartVmSnapshotData/_kDartSnapshotData)'",
                      indent + "sym = syms[0]",
                  ]
                  lines[index:index + 1] = replacement
                  patched = "\n".join(lines) + ("\n" if source.endswith("\n") else "")
                  compile(patched, str(path), "exec")
                  path.write_text(patched)
                  print("Applied snapshot-symbol fallback and verified Python syntax")
                  break
          else:
              if "_kDartSnapshotData" in source and "_kDartVmSnapshotData" in source:
                  compile(source, str(path), "exec")
                  print("Snapshot-symbol fallback already present; syntax is valid")
              else:
                  raise SystemExit("Could not safely patch extract_dart_info.py; upstream source changed")
          PY

      - name: Run Blutter
        env:
          CC: gcc-13
          CXX: g++-13
        run: |
          set -euo pipefail
          .venv/bin/python blutter.py input output

      - name: Package analysis results
        if: success()
        run: |
          set -euo pipefail
          test -d output
          test "$(find output -type f | wc -l)" -gt 0
          zip -qr blutter-output.zip output

      - name: Upload ZIP artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: blutter-output
          path: blutter-output.zip
          if-no-files-found: error
          retention-days: 14
