name: Blutter Analyze

on:
  workflow_dispatch:
  push:
    paths:
      - "input/**"
      - ".github/workflows/blutter.yml"

permissions:
  contents: read

concurrency:
  group: blutter-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout workflow and input files
        uses: actions/checkout@v4

      - name: Validate input libraries
        shell: bash
        run: |
          set -euo pipefail
          test -s input/libapp.so || {
            echo "::error::Missing input/libapp.so"
            exit 1
          }
          test -s input/libflutter.so || {
            echo "::error::Missing input/libflutter.so"
            exit 1
          }

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential gcc-13 g++-13 \
            cmake ninja-build pkg-config \
            libicu-dev libcapstone-dev \
            python3 python3-pip python3-venv \
            git zip unzip

      - name: Configure Python environment
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install pyelftools requests

      - name: Get Blutter with Dart 3.13 support
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/worawit/blutter.git blutter-src
          git -C blutter-src fetch --depth 1 origin pull/213/head:refs/remotes/origin/pr-213
          git -C blutter-src checkout refs/remotes/origin/pr-213
          mkdir -p blutter-src/input
          cp input/libapp.so input/libflutter.so blutter-src/input/
          git -C blutter-src log -1 --oneline

      - name: Check compiler
        run: |
          gcc-13 --version
          g++-13 --version
          cmake --version
          ninja --version

      - name: Run Blutter
        env:
          CC: gcc-13
          CXX: g++-13
        run: |
          set -euo pipefail
          .venv/bin/python blutter-src/blutter.py blutter-src/input blutter-src/output

      - name: Package analysis results
        if: success()
        run: |
          set -euo pipefail
          test -d blutter-src/output
          test "$(find blutter-src/output -type f | wc -l)" -gt 0
          zip -qr blutter-output.zip blutter-src/output

      - name: Upload ZIP artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: blutter-output
          path: blutter-output.zip
          if-no-files-found: error
          retention-days: 14
