name: Blutter Analyze

on:
  workflow_dispatch:
  push:
    paths:
      - "input/**"
      - ".github/workflows/blutter.yml"

permissions:
  contents: read

concurrency:
  group: blutter-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate input libraries
        shell: bash
        run: |
          set -euo pipefail
          test -s input/libapp.so || { echo "::error::Missing input/libapp.so"; exit 1; }
          test -s input/libflutter.so || { echo "::error::Missing input/libflutter.so"; exit 1; }

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-13 g++-13 cmake ninja-build pkg-config libicu-dev libcapstone-dev python3 python3-pip python3-venv git zip unzip binutils

      - name: Configure Python environment
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install pyelftools requests

      - name: Get Blutter with Dart 3.13 support
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/worawit/blutter.git blutter-src
          git -C blutter-src fetch --depth 1 origin pull/213/head:refs/remotes/origin/pr-213
          git -C blutter-src checkout refs/remotes/origin/pr-213
          mkdir -p blutter-src/input blutter-src/output
          cp input/libapp.so input/libflutter.so blutter-src/input/
          git -C blutter-src log -1 --oneline

      - name: Inspect input libraries
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "=== libapp.so ==="
            file input/libapp.so
            readelf -h input/libapp.so | grep -E 'Class:|Machine:'
            echo "=== snapshot symbols ==="
            readelf -Ws input/libapp.so | grep -E '_kDart(Vm)?Snapshot(Data|Instructions|BuildId)' || true
            echo "=== libflutter.so ==="
            file input/libflutter.so
            readelf -h input/libflutter.so | grep -E 'Class:|Machine:'
          } | tee elf-report.txt

      - name: Run Blutter and preserve diagnostics
        shell: bash
        env:
          CC: gcc-13
          CXX: g++-13
        run: |
          set -uo pipefail
          mkdir -p blutter-src/output artifact-package
          set +e
          .venv/bin/python blutter-src/blutter.py blutter-src/input blutter-src/output 2>&1 | tee blutter-run.log
          status=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$status" > blutter-exit-code.txt
          echo "Blutter process exit code: $status"
          output_count=$(find blutter-src/output -type f 2>/dev/null | wc -l)
          echo "Output file count: $output_count"
          if [ "$status" -ne 0 ] || grep -qE 'Analysis error|exception:|Traceback \(most recent call last\)|fatal error:|(^|[[:space:]])error:' blutter-run.log; then
            echo "FAILED: Blutter reported analysis/build errors." > analysis-status.txt
          elif [ "$output_count" -eq 0 ]; then
            echo "FAILED: Blutter exited without errors but generated no output files." > analysis-status.txt
          else
            echo "SUCCESS: Blutter generated output files." > analysis-status.txt
          fi

      - name: Prepare artifact contents
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact-package
          [ ! -f blutter-run.log ] || cp blutter-run.log artifact-package/
          [ ! -f elf-report.txt ] || cp elf-report.txt artifact-package/
          [ ! -f blutter-exit-code.txt ] || cp blutter-exit-code.txt artifact-package/
          [ ! -f analysis-status.txt ] || cp analysis-status.txt artifact-package/
          if [ -d blutter-src/output ]; then
            mkdir -p artifact-package/output
            cp -a blutter-src/output/. artifact-package/output/
          fi
          {
            echo "Blutter run diagnostics"
            echo "Commit: $(git -C blutter-src rev-parse HEAD 2>/dev/null || echo unavailable)"
            echo "Input libapp SHA256: $(sha256sum input/libapp.so 2>/dev/null | cut -d' ' -f1 || echo unavailable)"
            echo "Input libflutter SHA256: $(sha256sum input/libflutter.so 2>/dev/null | cut -d' ' -f1 || echo unavailable)"
            echo "Output files:"
            find artifact-package/output -type f -printf '%p (%s bytes)\n' 2>/dev/null || true
            echo
            cat artifact-package/analysis-status.txt 2>/dev/null || true
          } > artifact-package/diagnostics.txt
          echo "=== Artifact contents ==="
          find artifact-package -type f -printf '%p (%s bytes)\n'

      - name: Upload output and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blutter-results-and-diagnostics
          path: artifact-package/
          if-no-files-found: error
          retention-days: 14

      - name: Fail job if analysis failed
        if: always()
        shell: bash
        run: |
          if [ -f analysis-status.txt ] && grep -q '^FAILED:' analysis-status.txt; then
            cat analysis-status.txt
            exit 1
          fi
          if [ ! -f analysis-status.txt ]; then
            echo "::error::Blutter did not reach the analysis stage; inspect preceding steps."
            exit 1
          fi
          cat analysis-status.txt
