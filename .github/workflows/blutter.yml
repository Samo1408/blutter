name: Blutter Analyze

on:
  workflow_dispatch:
  push:
    paths:
      - "input/**"
      - ".github/workflows/blutter.yml"

permissions:
  contents: read

concurrency:
  group: blutter-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout workflow and input files
        uses: actions/checkout@v4

      - name: Validate input libraries
        shell: bash
        run: |
          set -euo pipefail
          test -s input/libapp.so || { echo "::error::Missing input/libapp.so"; exit 1; }
          test -s input/libflutter.so || { echo "::error::Missing input/libflutter.so"; exit 1; }

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-13 g++-13 cmake ninja-build pkg-config libicu-dev libcapstone-dev python3 python3-pip python3-venv git zip unzip binutils

      - name: Configure Python environment
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install pyelftools requests

      - name: Get Blutter with Dart 3.13 support
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/worawit/blutter.git blutter-src
          git -C blutter-src fetch --depth 1 origin pull/213/head:refs/remotes/origin/pr-213
          git -C blutter-src checkout refs/remotes/origin/pr-213
          mkdir -p blutter-src/input blutter-src/output
          cp input/libapp.so input/libflutter.so blutter-src/input/
          git -C blutter-src log -1 --oneline

      - name: Inspect target ELF and snapshot symbols
        shell: bash
        run: |
          set -euo pipefail
          echo "=== libapp.so ==="
          file input/libapp.so
          readelf -h input/libapp.so | grep -E 'Class:|Machine:'
          echo "=== snapshot symbols ==="
          readelf -Ws input/libapp.so | grep -E '_kDart(Vm)?Snapshot(Data|Instructions|BuildId)' || true
          echo "=== libflutter.so ==="
          file input/libflutter.so
          readelf -h input/libflutter.so | grep -E 'Class:|Machine:'

      - name: Check compiler
        run: |
          gcc-13 --version
          g++-13 --version
          cmake --version
          ninja --version

      - name: Run Blutter with full log
        id: blutter
        env:
          CC: gcc-13
          CXX: g++-13
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p blutter-src/output
          set +e
          .venv/bin/python blutter-src/blutter.py blutter-src/input blutter-src/output 2>&1 | tee blutter-run.log
          status=${PIPESTATUS[0]}
          set -e
          echo "BLUTTER_EXIT_CODE=$status" | tee -a blutter-run.log
          echo "=== Files created by Blutter ==="
          find blutter-src/output -maxdepth 3 -type f -printf '%p (%s bytes)\n' | tee -a blutter-run.log
          if grep -qE 'exception: getting native function pool object|Traceback \(most recent call last\)|fatal error:|error: ' blutter-run.log; then
            echo "::error::Blutter reported a fatal or analysis error; inspect blutter-run.log and output contents."
          fi
          # Do not hide failures; artifact upload below still runs for diagnosis.
          exit "$status"

      - name: Package any generated output and diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact-package
          if [ -d blutter-src/output ]; then
            cp -a blutter-src/output artifact-package/output
          fi
          if [ -f blutter-run.log ]; then
            cp blutter-run.log artifact-package/
          fi
          {
            echo "Blutter run diagnostics"
            echo "Commit: $(git -C blutter-src rev-parse HEAD 2>/dev/null || echo unavailable)"
            echo "Input libapp SHA256: $(sha256sum input/libapp.so | cut -d' ' -f1)"
            echo "Input libflutter SHA256: $(sha256sum input/libflutter.so | cut -d' ' -f1)"
            echo "Output files:"
            find artifact-package/output -type f -printf '%p (%s bytes)\n' 2>/dev/null || true
          } > artifact-package/diagnostics.txt
          zip -qr blutter-run-artifacts.zip artifact-package

      - name: Upload results and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blutter-run-artifacts
          path: blutter-run-artifacts.zip
          if-no-files-found: error
          retention-days: 14
