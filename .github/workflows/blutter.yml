name: Blutter Analyze

on:
  workflow_dispatch:
  push:
    paths:
      - "input/**"
      - ".github/workflows/blutter.yml"

permissions:
  contents: read

concurrency:
  group: blutter-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate input libraries
        shell: bash
        run: |
          set -euo pipefail
          test -s input/libapp.so || { echo "::error::Missing input/libapp.so"; exit 1; }
          test -s input/libflutter.so || { echo "::error::Missing input/libflutter.so"; exit 1; }

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-13 g++-13 cmake ninja-build pkg-config libicu-dev libcapstone-dev python3 python3-pip python3-venv git zip unzip binutils

      - name: Configure Python environment
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install pyelftools requests

      - name: Get Blutter with Dart 3.13 support
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/worawit/blutter.git blutter-src
          git -C blutter-src fetch --depth 1 origin pull/213/head:refs/remotes/origin/pr-213
          git -C blutter-src checkout refs/remotes/origin/pr-213
          mkdir -p blutter-src/input blutter-src/output-full blutter-src/output-no-analysis
          cp input/libapp.so input/libflutter.so blutter-src/input/
          git -C blutter-src log -1 --oneline

      - name: Inspect input libraries
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "=== libapp.so ==="
            file input/libapp.so
            readelf -h input/libapp.so | grep -E 'Class:|Machine:'
            readelf -Ws input/libapp.so | grep -E '_kDart(Vm)?Snapshot(Data|Instructions|BuildId)' || true
            echo "=== libflutter.so ==="
            file input/libflutter.so
            readelf -h input/libflutter.so | grep -E 'Class:|Machine:'
          } | tee elf-report.txt

      - name: Run full analysis, then fallback without code analysis
        id: run_blutter
        shell: bash
        env:
          CC: gcc-13
          CXX: g++-13
        run: |
          set -uo pipefail
          mkdir -p blutter-src/output-full blutter-src/output-no-analysis artifact-package

          echo "=== Attempt 1: full analysis ===" | tee full-analysis.log
          set +e
          .venv/bin/python blutter-src/blutter.py blutter-src/input blutter-src/output-full 2>&1 | tee -a full-analysis.log
          full_status=${PIPESTATUS[0]}
          set -e
          full_count=$(find blutter-src/output-full -type f 2>/dev/null | wc -l)
          if [ "$full_status" -eq 0 ] && [ "$full_count" -gt 0 ] && ! grep -qE 'Analysis error|exception:|Traceback \(most recent call last\)' full-analysis.log; then
            echo "SUCCESS: full analysis generated $full_count files." | tee analysis-status.txt
          else
            echo "Full analysis did not produce valid output (exit=$full_status, files=$full_count)." | tee analysis-status.txt
            echo "=== Attempt 2: --no-analysis fallback ===" | tee no-analysis.log
            set +e
            .venv/bin/python blutter-src/blutter.py blutter-src/input blutter-src/output-no-analysis --no-analysis 2>&1 | tee -a no-analysis.log
            no_status=${PIPESTATUS[0]}
            set -e
            no_count=$(find blutter-src/output-no-analysis -type f 2>/dev/null | wc -l)
            if [ "$no_status" -eq 0 ] && [ "$no_count" -gt 0 ]; then
              echo "PARTIAL_SUCCESS: --no-analysis generated $no_count files; full analysis failed." | tee -a analysis-status.txt
            else
              echo "FAILED: full analysis and --no-analysis fallback both failed (fallback exit=$no_status, files=$no_count)." | tee -a analysis-status.txt
            fi
          fi
          printf '%s\n' "$full_status" > full-analysis-exit-code.txt
          echo "Full-analysis output files: $full_count"
          find blutter-src/output-full -type f -printf '%p (%s bytes)\n' || true
          if [ -f no-analysis.log ]; then
            echo "Fallback output files:"
            find blutter-src/output-no-analysis -type f -printf '%p (%s bytes)\n' || true
          fi

      - name: Prepare artifact contents
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact-package/full-analysis artifact-package/no-analysis
          [ ! -f full-analysis.log ] || cp full-analysis.log artifact-package/
          [ ! -f no-analysis.log ] || cp no-analysis.log artifact-package/
          [ ! -f elf-report.txt ] || cp elf-report.txt artifact-package/
          [ ! -f analysis-status.txt ] || cp analysis-status.txt artifact-package/
          [ ! -f full-analysis-exit-code.txt ] || cp full-analysis-exit-code.txt artifact-package/
          if [ -d blutter-src/output-full ]; then cp -a blutter-src/output-full/. artifact-package/full-analysis/; fi
          if [ -d blutter-src/output-no-analysis ]; then cp -a blutter-src/output-no-analysis/. artifact-package/no-analysis/; fi
          {
            echo "Blutter Dart 3.13 diagnostics"
            echo "Commit: $(git -C blutter-src rev-parse HEAD 2>/dev/null || echo unavailable)"
            echo "Input libapp SHA256: $(sha256sum input/libapp.so | cut -d' ' -f1)"
            echo "Input libflutter SHA256: $(sha256sum input/libflutter.so | cut -d' ' -f1)"
            echo
            cat artifact-package/analysis-status.txt 2>/dev/null || true
            echo
            echo "Generated files:"
            find artifact-package -type f -printf '%p (%s bytes)\n'
          } > artifact-package/diagnostics.txt
          echo "=== Artifact files ==="
          find artifact-package -type f -printf '%p (%s bytes)\n'

      - name: Upload outputs and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blutter-run12-results
          path: artifact-package/
          if-no-files-found: error
          retention-days: 14

      - name: Fail only if both attempts failed
        if: always()
        shell: bash
        run: |
          if [ ! -f analysis-status.txt ]; then
            echo "::error::Blutter did not reach the analysis stage."
            exit 1
          fi
          cat analysis-status.txt
          if grep -q '^FAILED:' analysis-status.txt; then exit 1; fi
